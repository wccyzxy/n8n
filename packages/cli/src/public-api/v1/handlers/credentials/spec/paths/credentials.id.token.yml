get:
  x-eov-operation-id: getToken
  x-eov-operation-handler: v1/handlers/credentials/credentials.handler
  tags:
    - Credential
  summary: Get credential token/data
  description: Returns the token or credential data. For OAuth credentials, returns the OAuth token data. For other credential types (e.g., apiKey), returns the full credential data.
  operationId: getToken
  parameters:
    - name: id
      in: path
      description: The credential ID
      required: true
      schema:
        type: string
  responses:
    '200':
      description: Operation successful.
      content:
        application/json:
          schema:
            type: object
            properties:
              token:
                type: object
                description: For OAuth credentials, returns OAuth token data. For other credential types, returns the full credential data.
    '401':
      $ref: '../../../../shared/spec/responses/unauthorized.yml'
    '404':
      description: Credential or token not found.
      $ref: '../../../../shared/spec/responses/notFound.yml'
post:
  x-eov-operation-id: refreshToken
  x-eov-operation-handler: v1/handlers/credentials/credentials.handler
  tags:
    - Credential
  summary: Refresh OAuth token
  description: Refreshes the OAuth token for the credential. Only works for OAuth2 credential types.
  operationId: refreshToken
  parameters:
    - name: id
      in: path
      description: The credential ID
      required: true
      schema:
        type: string
  responses:
    '200':
      description: Operation successful.
      content:
        application/json:
          schema:
            type: object
            properties:
              token:
                type: object
                description: Refreshed OAuth token data
    '400':
      description: Bad request. Only OAuth2 credentials support token refresh or refresh token not available.
      $ref: '../../../../shared/spec/responses/badRequest.yml'
    '401':
      $ref: '../../../../shared/spec/responses/unauthorized.yml'
    '404':
      description: Credential or token not found.
      $ref: '../../../../shared/spec/responses/notFound.yml'
