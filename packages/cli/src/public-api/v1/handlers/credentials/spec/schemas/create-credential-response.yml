required:
  - id
  - name
  - type
  - createdAt
  - updatedAt
type: object
properties:
  id:
    type: string
    readOnly: true
    example: vHxaz5UaCghVYl9C
  name:
    type: string
    example: John's Github account
  type:
    type: string
    example: githubApi
  tenantId:
    type: string
    maxLength: 128
    example: tenant-123
    description: Tenant ID for multi-tenant support
  isTenantDynamic:
    type: boolean
    example: false
    description: Whether the credential uses tenant dynamic credentials
  parent:
    type: string
    maxLength: 36
    nullable: true
    example: parent-credential-id
    description: ID of the parent credential that this tenant credential was created from
  createdAt:
    type: string
    format: date-time
    readOnly: true
    example: '2022-04-29T11:02:29.842Z'
  updatedAt:
    type: string
    format: date-time
    readOnly: true
    example: '2022-04-29T11:02:29.842Z'
