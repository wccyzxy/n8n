required:
  - name
  - type
  - data
type: object
properties:
  id:
    type: string
    readOnly: true
    example: R2DjclaysHbqn778
  name:
    type: string
    example: Joe's Github Credentials
  type:
    type: string
    example: githubApi
  data:
    type: object
    writeOnly: true
    example: { accessToken: 'ada612vad6fa5df4adf5a5dsf4389adsf76da7s' }
  isResolvable:
    type: boolean
    example: false
    description: Whether this credential has resolvable fields
  tenantId:
    type: string
    maxLength: 128
    example: tenant-123
    description: Tenant ID for multi-tenant support
  isTenantDynamic:
    type: boolean
    example: false
    description: Whether the credential uses tenant dynamic credentials
  parent:
    type: string
    maxLength: 36
    nullable: true
    example: parent-credential-id
    description: ID of the parent credential that this tenant credential was created from
  createdAt:
    type: string
    format: date-time
    readOnly: true
    example: '2022-04-29T11:02:29.842Z'
  updatedAt:
    type: string
    format: date-time
    readOnly: true
    example: '2022-04-29T11:02:29.842Z'
