get:
  x-eov-operation-id: checkConnected
  x-eov-operation-handler: v1/handlers/credentials/credentials.handler
  tags:
    - Credential
  summary: Check if credential is connected/configured
  description: Checks if the credential is connected or properly configured. For OAuth credentials, checks if token data exists. For other credential types (e.g., apiKey), checks if credential data exists and has content.
  operationId: checkConnected
  parameters:
    - name: id
      in: path
      description: The credential ID
      required: true
      schema:
        type: string
  responses:
    '200':
      description: Operation successful.
      content:
        application/json:
          schema:
            type: object
            properties:
              connected:
                type: boolean
                description: Whether the credential is connected/configured
                example: true
    '401':
      $ref: '../../../../shared/spec/responses/unauthorized.yml'
    '404':
      $ref: '../../../../shared/spec/responses/notFound.yml'
